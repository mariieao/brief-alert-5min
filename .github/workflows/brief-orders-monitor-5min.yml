name: Brief orders monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '4-59/5 * * * *'

permissions:
  contents: read

concurrency:
  group: brief-orders-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-slim
    timeout-minutes: 8
    steps:
      - name: Restore previous count
        uses: actions/cache@v4
        with:
          path: |
            brief-count.txt
            brief-notifications-state.json
          key: brief-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            brief-v3-

      - name: Install browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Check new orders
        env:
          BRIEF_EMAIL: ${{ secrets.BRIEF_EMAIL }}
          BRIEF_PASSWORD: ${{ secrets.BRIEF_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import hashlib
          import hmac
          import os
          import re
          import sys
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          required = ("BRIEF_EMAIL", "BRIEF_PASSWORD",
                      "TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID")
          if any(not os.environ.get(k) for k in required):
              sys.exit("MISSING_SECRETS")

          # Site timestamps are displayed in Russian. Reject notifications
          # with an explicitly old date even if the title/text has changed.
          # No raw notification details are printed into public CI logs.
          SITE_TZ = ZoneInfo("Europe/Moscow")
          MONTHS = {
              "янв": 1, "фев": 2, "мар": 3, "апр": 4, "ма": 5,
              "июн": 6, "июл": 7, "авг": 8, "сен": 9, "окт": 10,
              "ноя": 11, "дек": 12,
          }

          def is_recent_notification(text, iso_time):
              now = datetime.now(SITE_TZ)
              lines = [s.strip() for s in text.splitlines() if s.strip()]
              footer = " ".join(lines[-2:]).lower()

              # The actual site shows e.g. 'Заказ №423 · 14 нояб.'
              dated = re.search(
                  r"\b(\d{1,2})\s+"
                  r"(янв\w*|фев\w*|мар\w*|апр\w*|мая|"
                  r"июн\w*|июл\w*|авг\w*|сен\w*|"
                  r"окт\w*|ноя\w*|дек\w*)\.?",
                  footer)
              if dated:
                  day = int(dated.group(1))
                  m = dated.group(2)
                  month = 5 if m == "мая" else next(
                      (val for prefix, val in MONTHS.items()
                       if m.startswith(prefix)), None)
                  if month is None:
                      return False
                  year = now.year - (1 if month > now.month else 0)
                  try:
                      event_day = datetime(year, month, day).date()
                  except ValueError:
                      return False
                  if event_day == now.date():
                      return True
                  # Catch 23:xx events first seen just after midnight.
                  if (event_day == now.date() - timedelta(days=1)
                          and now.hour == 0 and now.minute <= 30):
                      return True
                  return False

              age = re.search(r"\b(\d+)\s*(сек|мин|час|ч\.|ч\b|дн|день|дня|дней)\s*назад", footer)
              if age:
                  n = int(age.group(1))
                  unit = age.group(2)
                  if unit.startswith("сек") or unit.startswith("мин"):
                      return n <= 90
                  if unit.startswith("ч"):
                      return n <= 1
                  return False
              if "только что" in footer or "сейчас" in footer:
                  return True
              if "вчера" in footer:
                  return now.hour == 0 and now.minute <= 30

              if iso_time:
                  try:
                      event = datetime.fromisoformat(
                          iso_time.replace("Z", "+00:00"))
                      if event.tzinfo is None:
                          event = event.replace(tzinfo=SITE_TZ)
                      age_seconds = (now - event.astimezone(SITE_TZ)).total_seconds()
                      return -300 <= age_seconds <= 90 * 60
                  except ValueError:
                      pass
              # When site provides no timestamp, rely on persistent
              # deduplication instead of pretending a date was confirmed.
              return None

          state = Path("brief-count.txt")
          try:
              previous = int(state.read_text().strip()) if state.exists() else None
          except ValueError:
              sys.exit("BAD_STORED_COUNT")

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(locale="ru-RU")
              try:
                  page.goto("https://order-union-chat.poehali.ws/",
                            wait_until="domcontentloaded", timeout=45000)
                  email = page.locator('input[type="email"]')
                  if email.count() == 0:
                      email = page.get_by_placeholder("you@example.com")
                  email.first.fill(os.environ["BRIEF_EMAIL"])
                  page.locator('input[type="password"]').first.fill(
                      os.environ["BRIEF_PASSWORD"])
                  page.get_by_role("button", name="Войти", exact=True).click()
                  page.get_by_text("Свободные заказы").first.wait_for(
                      state="visible", timeout=35000)
                  page.get_by_text(re.compile(r"\d+\s+открыто", re.I)).first.wait_for(
                      state="visible", timeout=20000)
                  text = page.locator("body").inner_text()
                  found = re.search(r"(\d+)\s+открыто", text, re.I)
                  if not found:
                      sys.exit("ORDER_COUNTER_NOT_FOUND")
                  current = int(found.group(1))

                  # Read the notification panel without opening individual
                  # notifications (opening them could mark them as read).
                  panel = page.locator('button[aria-label*="ведом" i]')
                  if not panel.count():
                      sys.exit("NOTIFICATION_BELL_NOT_FOUND")
                  panel.first.click()
                  page.get_by_text("Уведомления", exact=True).first.wait_for(
                      state="visible", timeout=12000)
                  page.wait_for_timeout(1200)

                  # The selector was verified by the private inspection job.
                  rows = page.locator("button.flex.w-full.items-start.gap-3")
                  notifications = []
                  for row in rows.all()[:30]:
                      title_node = row.locator("span.font-medium")
                      if not title_node.count():
                          continue
                      title = title_node.first.inner_text().strip()
                      details = [x.strip() for x in
                                 row.locator("span.text-muted-foreground").all_inner_texts()]
                      subtitle = details[0] if details else ""
                      combined = row.inner_text()
                      order_match = re.search(r"Заказ\s*№\s*(\d+)", combined, re.I)
                      order_no = order_match.group(1) if order_match else ""
                      when_node = row.locator("time[datetime]")
                      absolute_when = (when_node.first.get_attribute("datetime")
                                       if when_node.count() else "")
                      # Do not incorporate labels like '39 мин назад': they
                      # change without a new notification being created.
                      identity = "\0".join((title, subtitle, order_no,
                                              absolute_when or ""))
                      digest = hmac.new(
                          os.environ["TELEGRAM_BOT_TOKEN"].encode(),
                          identity.encode(), hashlib.sha256).hexdigest()
                      recency = is_recent_notification(combined, absolute_when)
                      notifications.append({"key": digest, "title": title,
                                        "subtitle": subtitle,
                                        "order_no": order_no, "recent": recency})
              finally:
                  browser.close()

          print(f"FREE_ORDERS: {previous} -> {current}")
          print("NOTIFICATIONS_VISIBLE:", len(notifications))

          def send_telegram(message):
              url = ("https://api.telegram.org/bot"
                     + os.environ["TELEGRAM_BOT_TOKEN"] + "/sendMessage")
              body = urllib.parse.urlencode({
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "text": message,
              }).encode()
              try:
                  request = urllib.request.Request(url, data=body)
                  with urllib.request.urlopen(request, timeout=20) as response:
                      sent = json.load(response)
                  if sent.get("ok") is not True:
                      sys.exit("TELEGRAM_SEND_FAILED")
              except Exception:
                  sys.exit("TELEGRAM_SEND_FAILED")

          # First run of the new version establishes a baseline to avoid
          # sending a flood of old notification history to Telegram.
          notification_state = Path("brief-notifications-state.json")
          if notification_state.exists():
              try:
                  old_hashes = json.loads(notification_state.read_text())
                  if not isinstance(old_hashes, list):
                      sys.exit("BAD_NOTIFICATION_STATE")
              except (ValueError, OSError):
                  sys.exit("BAD_NOTIFICATION_STATE")
              known = set(old_hashes)
              candidates = [n for n in notifications if n["key"] not in known]
              fresh = [n for n in candidates if n["recent"] is not False]
              print("OLD_NOTIFICATIONS_SKIPPED:",
                    len(candidates) - len(fresh))
              print("UNKNOWN_DATED_NEW_ITEMS:",
                    sum(n["recent"] is None for n in fresh))
              # Send in chronological order (the panel lists newest first).
              for n in reversed(fresh[:30]):
                  msg = "🔔 Бриф: новое уведомление\n" + n["title"]
                  if n["subtitle"]:
                      msg += "\n" + n["subtitle"][:600]
                  if n["order_no"] and n["order_no"] not in n["title"]:
                      msg += "\nЗаказ №" + n["order_no"]
                  msg += "\nhttps://order-union-chat.poehali.ws/"
                  send_telegram(msg[:3900])
              print("NEW_NOTIFICATIONS:", len(fresh))
          else:
              print("NOTIFICATIONS_BASELINE_CREATED:", len(notifications))
              old_hashes = []

          # Cache only keyed fingerprints, never private message text.
          combined_keys = list(dict.fromkeys(
              [n["key"] for n in notifications] + old_hashes))[:5000]
          notification_state.write_text(json.dumps(combined_keys))

          if previous is None:
              print("ORDER_BASELINE_CREATED")
          elif current > previous:
              message = (f"Новые свободные заказы! Сейчас открыто: {current}.\n"
                         "https://order-union-chat.poehali.ws/")
              send_telegram(message)
              print("ALERT_SENT")
          else:
              print("NO_NEW_ORDERS")

          state.write_text(str(current) + "\n")
          PY
